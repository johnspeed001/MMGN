_target_: model_interface.BaselineModule
params_model:
  name: SIREN
  dim_in: 3
  dim_hidden: 128
  dim_out: 1
  num_layers: 5
  w0: 1.0
  w0_initial: 30.0
  use_bias: True
  final_activation: null
  save_dir: ${hydra:run.dir}
params_optim:
  optim_alg: Adam
  optim_lr: 1e-4
  optim_wd: 0.0
  loss: MSELoss
params_scheduler: ${scheduler}